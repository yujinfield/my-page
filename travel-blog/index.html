<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여행 글 메이커</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/form.css">
</head>
<body>
  <header class="app-header">
    <div>
      <h1 class="app-title">✈️ 여행 글 메이커</h1>
      <p class="app-subtitle">종류를 고르고 내 경험을 적으면, 파트너스 링크가 들어간 블로그 후기 글을 만들어 드려요.</p>
    </div>
    <button type="button" id="theme-button" class="icon-button" aria-label="다크 모드 전환">🌙</button>
  </header>

  <nav class="category-tabs" role="tablist" aria-label="글 종류" id="category-tabs"></nav>

  <main class="workspace">
    <section class="form-panel" aria-label="입력">
      <fieldset class="card">
        <legend class="card-title">1. 기본 정보</legend>
        <div id="basic-fields"></div>
      </fieldset>

      <fieldset class="card">
        <legend class="card-title" id="detail-title">2. 상세 정보</legend>
        <div id="detail-fields"></div>
      </fieldset>

      <fieldset class="card">
        <legend class="card-title">3. 장단점과 총평</legend>
        <div id="review-fields"></div>
      </fieldset>

      <fieldset class="card">
        <legend class="card-title">4. 파트너스 링크</legend>
        <div id="partner-fields"></div>
      </fieldset>

      <div class="form-actions">
        <button type="button" id="reset-button" class="text-button">이 종류 입력 비우기</button>
        <a href="#result" class="primary-button jump-link">완성된 글 보기 ↓</a>
      </div>
    </section>

    <section class="result-panel" id="result" aria-labelledby="result-title">
      <h2 class="result-title" id="result-title">완성된 글</h2>
      <p id="missing-text" class="missing-text" role="status"></p>

      <h3 class="result-subtitle">제목 후보</h3>
      <ul id="title-list" class="title-list"></ul>

      <h3 class="result-subtitle">본문</h3>
      <div class="copy-buttons">
        <button type="button" class="primary-button" id="copy-rich">서식 그대로 복사</button>
        <button type="button" class="secondary-button" id="copy-html">HTML 복사</button>
        <button type="button" class="secondary-button" id="copy-text">텍스트 복사</button>
        <button type="button" class="secondary-button" id="copy-tags">해시태그 복사</button>
      </div>
      <p class="copy-help">네이버·티스토리 편집기에는 <strong>서식 그대로 복사</strong>, 티스토리 HTML 모드에는 <strong>HTML 복사</strong>를 쓰세요.</p>

      <article id="preview" class="preview" aria-label="글 미리보기"></article>
    </section>
  </main>

  <p id="toast" class="toast" role="status" hidden></p>

  <script type="module" src="js/app.js"></script>
</body>
</html>
