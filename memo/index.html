<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEMO</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- 상단 헤더: MEMO 제목 + + 버튼 -->
    <header id="header">
      <span id="logo">MEMO</span>
      <button id="btn-new" aria-label="새 메모 작성" title="새 메모">+</button>
    </header>

    <!-- 본문: 사이드바(태그) | 목록 | 에디터 -->
    <div id="main">

      <!-- 왼쪽: 해시태그 목록 -->
      <aside id="sidebar">
        <ul id="tag-list"></ul>
      </aside>

      <!-- 가운데: 메모 목록 -->
      <section id="list-panel">
        <ul id="memo-list"></ul>
      </section>

      <!-- 오른쪽: 메모 편집 -->
      <section id="editor-panel">
        <div id="editor-actions">
          <button id="btn-delete" aria-label="메모 삭제" title="삭제">🗑</button>
        </div>
        <textarea
          id="editor"
          placeholder="+ 버튼으로 새 메모를 만들거나&#10;왼쪽 목록에서 메모를 선택하세요."
        ></textarea>
        <div id="status-bar">
          <span id="char-count"></span>
          <span id="save-status"></span>
        </div>
      </section>

    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
