<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEMO</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="header">
    <button id="btn-menu" aria-label="메뉴 열기">☰</button>
    <span id="logo">MEMO</span>
    <button id="btn-new" aria-label="새 메모">+</button>
  </header>

  <div id="sidebar-overlay"></div>
  <aside id="sidebar">
    <div id="sidebar-head">
      <span id="sidebar-head-title">폴더</span>
      <button id="btn-new-folder" aria-label="폴더 만들기">＋ 새 폴더</button>
    </div>
    <div id="new-folder-form" hidden>
      <label>새 폴더 이름</label>
      <input type="text" id="new-folder-input" placeholder="예: 여행, 공부, 일기" autocomplete="off" maxlength="30">
      <div id="folder-form-btns">
        <button id="btn-folder-cancel">취소</button>
        <button id="btn-folder-ok">만들기</button>
      </div>
    </div>
    <ul id="tag-list"></ul>
  </aside>

  <div id="main">
    <section id="list-panel">
      <div id="list-header">메모</div>
      <ul id="memo-list"></ul>
    </section>

    <section id="editor-panel">
      <div id="editor-actions">
        <button id="btn-back" aria-label="목록으로 돌아가기">‹ 목록</button>
        <button id="btn-delete" aria-label="메모 삭제">🗑</button>
      </div>
      <div id="delete-confirm" hidden>
        <span>정말 삭제할까요?</span>
        <button id="btn-delete-cancel">취소</button>
        <button id="btn-delete-ok">삭제</button>
      </div>

      <input type="text" id="editor-title" placeholder="제목" autocomplete="off">
      <div id="editor-date"></div>

      <div id="editor-tags">
        <div id="tags-chips-row">
          <span class="tags-label">태그</span>
          <div id="tags-chips"></div>
          <button id="btn-add-tag" aria-label="태그 추가">＋ 추가</button>
        </div>
        <div id="add-tag-area" hidden>
          <div id="tag-input-row">
            <input type="text" id="tag-input" placeholder="태그 이름 입력" autocomplete="off">
            <button id="btn-tag-cancel">취소</button>
            <button id="btn-tag-ok">추가</button>
          </div>
          <div id="tag-suggestions"></div>
        </div>
      </div>

      <div id="format-bar" hidden>
        <button id="fmt-bold" aria-label="볼드" title="굵게 (Bold)"><strong>B</strong></button>
        <button id="fmt-italic" aria-label="이탤릭" title="기울임 (Italic)"><em>I</em></button>
        <div class="fmt-sep"></div>
        <button id="fmt-highlight" aria-label="형광펜" title="형광펜">🖊</button>
        <div id="highlight-picker" hidden>
          <button class="color-swatch" data-mark-color="yellow" style="background:#ffd700" title="노랑"></button>
          <button class="color-swatch" data-mark-color="green"  style="background:#5dde7a" title="초록"></button>
          <button class="color-swatch" data-mark-color="red"    style="background:#ff7070" title="빨강"></button>
          <button class="color-swatch" data-mark-color="blue"   style="background:#70a8ff" title="파랑"></button>
          <button class="color-swatch" data-mark-color="orange" style="background:#ffa040" title="주황"></button>
        </div>
        <div class="fmt-sep"></div>
        <button id="fmt-bullet" aria-label="목록" title="목록 (-)" style="font-size:16px">•</button>
        <button id="fmt-checkbox" aria-label="체크박스" title="체크박스">☐</button>
      </div>

      <div id="editor-body"
           contenteditable="true"
           spellcheck="true"
           data-placeholder="내용을 입력하세요... (- 로 시작하면 목록이 됩니다)"
           role="textbox"
           aria-multiline="true"></div>

      <div id="status-bar">
        <span id="char-count"></span>
        <span id="save-status"></span>
      </div>
    </section>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
